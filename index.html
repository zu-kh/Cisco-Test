<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Quiz Application</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --success: #10b981;
            --success-bg: #d1fae5;
            --success-border: #34d399;
            --error: #ef4444;
            --error-bg: #fee2e2;
            --error-border: #f87171;
            --border-color: #e2e8f0;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .quiz-container {
            background: var(--card-bg);
            width: 100%;
            max-width: 700px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 32px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .quiz-header {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .progress-bar-background {
            width: 100%;
            height: 8px;
            background-color: var(--border-color);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background-color: var(--primary);
            width: 0%;
            transition: width 0.3s ease;
        }

        .question-text {
            font-size: 1.25rem;
            font-weight: 600;
            line-height: 1.5;
            color: var(--text-primary);
            white-space: pre-wrap;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background-color: #ffffff;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 14px 18px;
            font-size: 1rem;
            color: var(--text-primary);
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--primary);
            background-color: #f8fafc;
        }

        .option-btn:focus-visible {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3);
        }

        .option-btn:disabled {
            cursor: not-allowed;
        }

        .option-btn.correct {
            background-color: var(--success-bg);
            border-color: var(--success-border);
            color: #065f46;
            font-weight: 600;
        }

        .option-btn.wrong {
            background-color: var(--error-bg);
            border-color: var(--error-border);
            color: #991b1b;
            font-weight: 600;
        }

        .quiz-footer {
            display: flex;
            justify-content: flex-end;
            margin-top: 8px;
        }

        .next-btn, .btn-primary {
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .next-btn:hover, .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .results-container {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .results-header {
            text-align: center;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .score-display {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--primary);
            margin: 12px 0 4px;
        }

        .score-percentage {
            font-size: 1.1rem;
            color: var(--text-secondary);
        }

        .missed-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 12px;
        }

        .missed-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-height: 350px;
            overflow-y: auto;
            padding-right: 6px;
        }

        .missed-item {
            background-color: #f8fafc;
            border-left: 4px solid var(--error);
            padding: 12px 16px;
            border-radius: 0 8px 8px 0;
            font-size: 0.95rem;
        }

        .missed-item .m-question {
            font-weight: 600;
            margin-bottom: 6px;
        }

        .missed-item .m-user {
            color: var(--error);
            margin-bottom: 2px;
        }

        .missed-item .m-correct {
            color: #059669;
            font-weight: 600;
        }

        .restart-btn {
            align-self: center;
            width: 100%;
            margin-top: 12px;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 600px) {
            .quiz-container {
                padding: 20px;
            }
            .question-text {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>

    <div class="quiz-container">
        <!-- Active Quiz Screen -->
        <div id="quiz-screen">
            <div class="quiz-header">
                <div class="progress-info">
                    <span id="question-progress">Question 1 of 12</span>
                    <span id="score-counter">Score: 0</span>
                </div>
                <div class="progress-bar-background">
                    <div id="progress-fill" class="progress-bar-fill"></div>
                </div>
            </div>

            <div style="margin-top: 20px;">
                <h2 id="question-text" class="question-text"></h2>
            </div>

            <div id="options-container" class="options-container" style="margin-top: 20px;">
                <!-- Buttons generated dynamically -->
            </div>

            <div class="quiz-footer">
                <button id="next-btn" class="next-btn hidden">Next Question</button>
            </div>
        </div>

        <!-- Results Screen -->
        <div id="results-screen" class="results-container hidden">
            <div class="results-header">
                <h2>Quiz Completed!</h2>
                <div id="score-display" class="score-display">0 / 0</div>
                <div id="score-percentage" class="score-percentage">0% Correct</div>
            </div>

            <div id="missed-section">
                <h3 class="missed-title">Review Missed Questions</h3>
                <div id="missed-list" class="missed-list">
                    <!-- Missed questions dynamically inserted -->
                </div>
            </div>

            <button id="restart-btn" class="btn-primary restart-btn">Restart Quiz</button>
        </div>
    </div>

    <script>
        // Inline Embedded Question & Answer Data
        const rawQuizData = [
            {
                question: "1.DRAG DROP\nRefer to the exhibit.\ninterface FastEthernet 0/1\nMatch the command elements:",
                options: [
                    "component to configure -> interface",
                    "interface type -> FastEthernet",
                    "port -> 1",
                    "Slot -> 0"
                ],
                answerIndex: 0
            },
            {
                question: "2. DRAG DROP\nMatch the virtualized data center component:",
                options: [
                    "virtual machine (VM) -> emulation of a computer system operating with its own physical hardware",
                    "virtual switch -> emulates a Layer 2 switch and provides network connectivity",
                    "Type 1 Hypervisor -> runs directly on physical server hardware for large-scale deployments",
                    "Type 2 Hypervisor -> runs as a software layer on a host OS for development/testing"
                ],
                answerIndex: 0
            },
            {
                question: "3. DRAG DROP\nMatch the network connectivity and management tools:",
                options: [
                    "PING -> sends ICMP echo request packets to verify connectivity",
                    "Telnet -> allows virtual terminal connections with unencrypted traffic",
                    "SSH -> provides secure, encrypted remote access to network devices",
                    "IP address configuration -> requires PC and Cisco device in same subnet"
                ],
                answerIndex: 0
            },
            {
                question: "4. DRAG DROP\nSelect the correct order of steps to capture the status of a Cisco device:",
                options: [
                    "Step 1: Connect to console port -> Step 2: Access CLI -> Step 3: Create capture file -> Step 4: Check status -> Step 5: Save output",
                    "Step 1: Access CLI -> Step 2: Connect to console port -> Step 3: Check status -> Step 4: Save output",
                    "Step 1: Create capture file -> Step 2: Connect to console port -> Step 3: Save output -> Step 4: Access CLI",
                    "Step 1: Connect to console port -> Step 2: Check status -> Step 3: Access CLI -> Step 4: Save output"
                ],
                answerIndex: 0
            },
            {
                question: "5. DRAG DROP\nMatch MDS switch characteristics to Director-Class:",
                options: [
                    "enterprise-class performance, scalable design, high port densities",
                    "fixed number of ports, ideal for Edge SAN deployments",
                    "suitable for small deployments with limited port expansion",
                    "unmanaged simple layer 2 switches"
                ],
                answerIndex: 0
            },
            {
                question: "6. DRAG DROP\nSelect the correct safety sequence prior to working with electrical equipment:",
                options: [
                    "Step 1: Locate emergency power-off -> Step 2: Disconnect power -> Step 3: Verify with multimeter -> Step 4: Connect ESD strap",
                    "Step 1: Disconnect power -> Step 2: Connect ESD strap -> Step 3: Verify with multimeter -> Step 4: Locate power-off",
                    "Step 1: Connect ESD strap -> Step 2: Disconnect power -> Step 3: Verify with multimeter -> Step 4: Locate power-off",
                    "Step 1: Verify with multimeter -> Step 2: Disconnect power -> Step 3: Connect ESD strap -> Step 4: Locate power-off"
                ],
                answerIndex: 0
            },
            {
                question: "7. DRAG DROP\nWhich field-replaceable unit is responsible for 'inability to manage or control switch functions'?",
                options: [
                    "supervisor module",
                    "fan module",
                    "line card",
                    "fabric module"
                ],
                answerIndex: 0
            },
            {
                question: "8. DRAG DROP\nWhich IPv4 addressing mode is used for testing and troubleshooting on the local device?",
                options: [
                    "loopback",
                    "broadcast",
                    "unicast",
                    "multicast"
                ],
                answerIndex: 0
            },
            {
                question: "9. DRAG DROP\nMatch Cisco collaboration endpoints: 'all-in-one devices for personal workspaces and meeting Rooms'",
                options: [
                    "Cisco Room Kit",
                    "Cisco Board",
                    "Cisco Desk Series",
                    "Quad Camera"
                ],
                answerIndex: 0
            },
            {
                question: "10. DRAG DROP\nWhich of the following is considered an Advantage of TFTP?",
                options: [
                    "simple setup and operation, transferring small files without security concerns",
                    "lack of security features and user authentication",
                    "built-in strong encryption and user access control",
                    "high performance optimization for large multi-gigabyte file transfers"
                ],
                answerIndex: 0
            },
            {
                question: "11. DRAG DROP\nWhere is the running configuration stored on a Cisco device?",
                options: [
                    "RAM",
                    "NVRAM",
                    "ROM",
                    "Flash memory"
                ],
                answerIndex: 0
            },
            {
                question: "12. DRAG DROP\nWhich layer of the TCP/IP process groups transport data into packets and adds a network header?",
                options: [
                    "internet layer",
                    "link layer",
                    "transport layer",
                    "application layer"
                ],
                answerIndex: 0
            },
            {
                question: "13. DRAG DROP\nWhich Cisco Data Center technology provides link aggregation and redundancy between switches?",
                options: [
                    "virtual port channels (vPCs)",
                    "Unified Fabric",
                    "Application Centric Infrastructure (ACI)",
                    "Fibre Channel over Ethernet (FCoE)"
                ],
                answerIndex: 0
            },
            {
                question: "14. DRAG DROP\nWhat is Step 1 in the boot sequence process of a Cisco device?",
                options: [
                    "Performs power-on self-test (POST)",
                    "Loads and runs bootstrap code (firmware)",
                    "Finds and loads the Cisco IOS Software",
                    "Finds and loads the configuration"
                ],
                answerIndex: 0
            },
            {
                question: "15. DRAG DROP\nWhich Cisco NX-OS component contains the full NX-OS kernel and operating system?",
                options: [
                    "System Image",
                    "Kickstart Image",
                    "Global configuration command mode",
                    "EXEC command mode"
                ],
                answerIndex: 0
            },
            {
                question: "16. DRAG DROP\nWhich Cisco tool is primarily used for copying IOS images to and from a router or switch?",
                options: [
                    "USB thumb drive",
                    "Flash card Reader",
                    "RJ-45 Ethernet loopback connector",
                    "RJ-45 coupler"
                ],
                answerIndex: 0
            }
        ];

        // State variables
        let currentQuestionIndex = 0;
        let score = 0;
        let missedQuestions = [];
        let questionAnswered = false;

        // DOM elements
        const quizScreen = document.getElementById('quiz-screen');
        const resultsScreen = document.getElementById('results-screen');
        const questionProgress = document.getElementById('question-progress');
        const scoreCounter = document.getElementById('score-counter');
        const progressFill = document.getElementById('progress-fill');
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const nextBtn = document.getElementById('next-btn');
        const scoreDisplay = document.getElementById('score-display');
        const scorePercentage = document.getElementById('score-percentage');
        const missedSection = document.getElementById('missed-section');
        const missedList = document.getElementById('missed-list');
        const restartBtn = document.getElementById('restart-btn');

        // Initialize App
        function initQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            missedQuestions = [];
            quizScreen.classList.remove('hidden');
            resultsScreen.classList.add('hidden');
            renderQuestion();
        }

        function renderQuestion() {
            questionAnswered = false;
            nextBtn.classList.add('hidden');

            const currentQ = rawQuizData[currentQuestionIndex];
            const totalQ = rawQuizData.length;

            // UI updates
            questionProgress.textContent = `Question ${currentQuestionIndex + 1} of ${totalQ}`;
            scoreCounter.textContent = `Score: ${score}`;
            progressFill.style.width = `${((currentQuestionIndex) / totalQ) * 100}%`;
            questionText.textContent = currentQ.question;

            // Render options
            optionsContainer.innerHTML = '';
            currentQ.options.forEach((optText, index) => {
                const button = document.createElement('button');
                button.className = 'option-btn';
                button.textContent = optText;
                button.addEventListener('click', () => handleOptionClick(index));
                optionsContainer.appendChild(button);
            });
        }

        function handleOptionClick(selectedIndex) {
            if (questionAnswered) return;
            questionAnswered = true;

            const currentQ = rawQuizData[currentQuestionIndex];
            const buttons = optionsContainer.querySelectorAll('.option-btn');

            // Disable all options
            buttons.forEach(btn => btn.disabled = true);

            if (selectedIndex === currentQ.answerIndex) {
                buttons[selectedIndex].classList.add('correct');
                score++;
                scoreCounter.textContent = `Score: ${score}`;
            } else {
                buttons[selectedIndex].classList.add('wrong');
                buttons[currentQ.answerIndex].classList.add('correct');
                missedQuestions.push({
                    question: currentQ.question,
                    userAnswer: currentQ.options[selectedIndex],
                    correctAnswer: currentQ.options[currentQ.answerIndex]
                });
            }

            if (currentQuestionIndex < rawQuizData.length - 1) {
                nextBtn.textContent = 'Next Question';
                nextBtn.classList.remove('hidden');
            } else {
                nextBtn.textContent = 'View Results';
                nextBtn.classList.remove('hidden');
            }
        }

        function handleNextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < rawQuizData.length) {
                renderQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            quizScreen.classList.add('hidden');
            resultsScreen.classList.remove('hidden');

            const totalQ = rawQuizData.length;
            const percentage = Math.round((score / totalQ) * 100);

            scoreDisplay.textContent = `${score} / ${totalQ}`;
            scorePercentage.textContent = `${percentage}% Correct`;

            if (missedQuestions.length === 0) {
                missedSection.classList.add('hidden');
            } else {
                missedSection.classList.remove('hidden');
                missedList.innerHTML = '';
                missedQuestions.forEach(item => {
                    const missedItem = document.createElement('div');
                    missedItem.className = 'missed-item';
                    missedItem.innerHTML = `
                        <div class="m-question">${escapeHtml(item.question)}</div>
                        <div class="m-user">Your answer: ${escapeHtml(item.userAnswer)}</div>
                        <div class="m-correct">Correct answer: ${escapeHtml(item.correctAnswer)}</div>
                    `;
                    missedList.appendChild(missedItem);
                });
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Event Listeners
        nextBtn.addEventListener('click', handleNextQuestion);
        restartBtn.addEventListener('click', initQuiz);

        // Start Quiz on load
        initQuiz();
    </script>
</body>
</html>
