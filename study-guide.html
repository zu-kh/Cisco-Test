        :root {

            --success-bg: #d1fae5;

            --success-text: #065f46;
            --border-color: #cbd5e1;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .header {
            background: var(--card-bg);
            padding: 24px 32px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border-left: 6px solid var(--primary);
        }

        .header h1 {
            font-size: 1.75rem;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .qa-card {
            background: var(--card-bg);
            padding: 24px 32px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .qa-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
        }

        .question-number {
            font-weight: 700;
            color: var(--primary);
            font-size: 1.1rem;
        }

        .type-badge {
            background-color: #e0e7ff;
            color: #4338ca;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .question-text {
            font-size: 1.1rem;
            font-weight: 600;
            line-height: 1.5;
            color: var(--text-primary);
        }

        .answer-box {
            background-color: var(--success-bg);
            border: 1px solid var(--success-border);
            border-radius: 8px;
            padding: 16px;
            margin-top: 8px;
        }

        .answer-label {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--success-text);
            text-transform: uppercase;
            margin-bottom: 8px;
            display: block;
        }

        .answer-list {
            list-style-type: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .answer-item {
            color: var(--success-text);
            font-weight: 600;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        @media print {
            body { background-color: #fff; padding: 0; }
            .qa-card { box-shadow: none; border: 1px solid #ccc; page-break-inside: avoid; }
        }
    </style>
