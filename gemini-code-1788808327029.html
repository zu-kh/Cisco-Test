<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cisco Field Technician Interactive Quiz</title>
  <style>
    :root {
      --bg-color: #f4f7f6;
      --card-bg: #ffffff;
      --primary: #005073;
      --primary-hover: #00364d;
      --text: #2c3e50;
      --correct: #2ecc71;
      --incorrect: #e74c3c;
      --border: #e0e0e0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .quiz-container {
      background-color: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 680px;
      padding: 30px;
      box-sizing: border-box;
    }

    .quiz-header {
      margin-bottom: 20px;
    }

    .progress-container {
      width: 100%;
      background-color: var(--border);
      height: 10px;
      border-radius: 5px;
      overflow: hidden;
      margin-bottom: 15px;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background-color: var(--primary);
      transition: width 0.3s ease;
    }

    .stats {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      font-weight: 600;
      color: #7f8c8d;
    }

    .question-text {
      font-size: 1.15rem;
      font-weight: 600;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-btn {
      background-color: #fff;
      border: 2px solid var(--border);
      border-radius: 8px;
      padding: 14px 18px;
      font-size: 1rem;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
      color: var(--text);
      outline: none;
    }

    .option-btn:hover:not([disabled]) {
      border-color: var(--primary);
      background-color: #f0f8ff;
    }

    .option-btn.correct {
      background-color: #e8f8f0 !important;
      border-color: var(--correct) !important;
      color: #1e8449;
      font-weight: bold;
    }

    .option-btn.incorrect {
      background-color: #fdeaea !important;
      border-color: var(--incorrect) !important;
      color: #c0392b;
    }

    .footer {
      margin-top: 30px;
      display: flex;
      justify-content: flex-end;
    }

    .next-btn, .restart-btn {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .next-btn:hover, .restart-btn:hover {
      background-color: var(--primary-hover);
    }

    .next-btn:disabled {
      background-color: #bdc3c7;
      cursor: not-allowed;
    }

    .results-container {
      text-align: center;
      padding: 20px 0;
    }

    .results-title {
      font-size: 1.8rem;
      margin-bottom: 10px;
    }

    .score-display {
      font-size: 3rem;
      font-weight: bold;
      color: var(--primary);
      margin: 20px 0;
    }

    .hide {
      display: none;
    }
  </style>
</head>
<body>

<div class="quiz-container">
  <div id="quiz-screen">
    <div class="quiz-header">
      <div class="progress-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      <div class="stats">
        <span id="question-count">Question 1/97</span>
        <span id="score-count">Score: 0</span>
      </div>
    </div>

    <div class="question-text" id="question-text">Loading question...</div>
    <div class="options-container" id="options-container"></div>

    <div class="footer">
      <button class="next-btn" id="next-btn" disabled>Next Question</button>
    </div>
  </div>

  <div id="results-screen" class="results-container hide">
    <h2 class="results-title">Quiz Completed!</h2>
    <p>Your Final Score:</p>
    <div class="score-display" id="final-score">0%</div>
    <p id="score-details">You got 0 out of 97 questions correct.</p>
    <button class="restart-btn" id="restart-btn" style="margin-top: 20px;">Restart Quiz</button>
  </div>
</div>

let currentQuestionIndex = 0;
let score = 0;
let selectedOption = null;

const questionTextEl = document.getElementById("question-text");
const optionsContainerEl = document.getElementById("options-container");
const progressBarEl = document.getElementById("progress-bar");
const questionCountEl = document.getElementById("question-count");
const scoreCountEl = document.getElementById("score-count");
const nextBtn = document.getElementById("next-btn");
const quizScreenEl = document.getElementById("quiz-screen");
const resultsScreenEl = document.getElementById("results-screen");
const finalScoreEl = document.getElementById("final-score");
const scoreDetailsEl = document.getElementById("score-details");
const restartBtn = document.getElementById("restart-btn");

function loadQuestion() {
  selectedOption = null;
  nextBtn.disabled = true;
  
  const currentQ = quizData[currentQuestionIndex];
  questionTextEl.textContent = `${currentQuestionIndex + 1}. ${currentQ.q}`;
  
  optionsContainerEl.innerHTML = "";
  
  currentQ.options.forEach((opt, index) => {
    const btn = document.createElement("button");
    btn.classList.add("option-btn");
    btn.textContent = opt;
    btn.addEventListener("click", () => selectOption(index));
    optionsContainerEl.appendChild(btn);
  });

  updateProgress();
}

function selectOption(index) {
  if (selectedOption !== null) return; // Prevent changing answer
  
  selectedOption = index;
  const currentQ = quizData[currentQuestionIndex];
  const buttons = optionsContainerEl.querySelectorAll(".option-btn");
  
  buttons.forEach((btn, i) => {
    btn.disabled = true;
    if (i === currentQ.answer) {
      btn.classList.add("correct");
    }
    if (i === index && index !== currentQ.answer) {
      btn.classList.add("incorrect");
    }
  });

  if (index === currentQ.answer) {
    score++;
    scoreCountEl.textContent = `Score: ${score}`;
  }

  nextBtn.disabled = false;
}

function updateProgress() {
  const total = quizData.length;
  const progressPercent = ((currentQuestionIndex) / total) * 100;
  progressBarEl.style.width = `${progressPercent}%`;
  questionCountEl.textContent = `Question ${currentQuestionIndex + 1}/${total}`;
}

nextBtn.addEventListener("click", () => {
  currentQuestionIndex++;
  if (currentQuestionIndex < quizData.length) {
    loadQuestion();
  } else {
    showResults();
  }
});

function showResults() {
  quizScreenEl.classList.add("hide");
  resultsScreenEl.classList.remove("hide");
  
  const percentage = Math.round((score / quizData.length) * 100);
  finalScoreEl.textContent = `${percentage}%`;
  scoreDetailsEl.textContent = `You answered ${score} out of ${quizData.length} questions correctly.`;
}

restartBtn.addEventListener("click", () => {
  currentQuestionIndex = 0;
  score = 0;
  scoreCountEl.textContent = "Score: 0";
  resultsScreenEl.classList.add("hide");
  quizScreenEl.classList.remove("hide");
  loadQuestion();
});

// Initialize Quiz
loadQuestion();
</script>
